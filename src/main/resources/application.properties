spring.application.name=meetingroomapi

# ==========================================
# 1. Configuración de la Conexión a MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/meetingroomdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Temp2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. Configuración de Hibernate / JPA
# ==========================================
# IMPORTANTE: Con Flyway, Hibernate ya no debe crear ni modificar las tablas. 
# Cambiamos a 'validate' para que Hibernate solo verifique que las entidades de Java 
# coincidan con las tablas creadas por Flyway en la base de datos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ==========================================
# 3. Configuración de Flyway
# ==========================================
spring.flyway.enabled=true

# Si tu base de datos ya tiene las tablas creadas de antes (o si quieres evitar 
# que Flyway falle al intentar aplicar el script V1 sobre una base existente), 
# esta propiedad le indica que tome un estado base inicial de forma automática:
spring.flyway.baseline-on-migrate=true

# Activa los logs de depuración
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.org.flywaydb=DEBUG
spring.flyway.clean-disabled=false